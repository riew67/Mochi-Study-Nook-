<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochi Study Space 🍡</title>
  
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-color: #fffaf0;
      --card-bg: #ffffff;
      --primary: #ffb7c5;
      --primary-hover: #ff9eaa;
      --text: #4a4a4a;
      --accent: #b5ead7;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      color: #ff7b9c;
    }

    .status-badge {
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 20px;
      background: #e0e0e0;
      color: #666;
      font-weight: bold;
    }

    .status-badge.connected {
      background: #d4edda;
      color: #155724;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 2px solid #ffe3e8;
      border-radius: 12px;
      outline: none;
      font-size: 1rem;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: #fff5f7;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    li.completed span {
      text-decoration: line-through;
      color: #aaa;
    }

    .delete-btn {
      background: transparent;
      color: #ff6b6b;
      padding: 4px 8px;
    }

    .delete-btn:hover {
      background: #ffe3e3;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🍡 Mochi Study Space</h1>
      <span id="status" class="status-badge">🔄 Connecting...</span>
    </div>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Tambah tugas baru..." onkeypress="handleKeyPress(event)">
      <button onclick="addTask()">Tambah</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script>
    // Config Supabase yang sudah diperbarui
    const SUPABASE_URL = "https://bfahyqgmqxlktxlycknz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_C2P-Tk-nHsPkssgkqMVvCQ_1mc02DiD";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let tasks = [];

    // Initialize & Fetch Data
    async function init() {
      const statusEl = document.getElementById('status');
      try {
        const { data, error } = await supabaseClient
          .from('user_data')
          .select('data')
          .eq('id', 'mochi_tasks')
          .single();

        if (error && error.code !== 'PGRST116') {
          console.error("Error loading tasks:", error);
          statusEl.innerText = "❌ Sync Error";
          statusEl.classList.remove('connected');
        } else {
          if (data && data.data) {
            tasks = data.data;
          }
          statusEl.innerText = "☁️ Cloud Connected";
          statusEl.classList.add('connected');
          renderTasks();
        }
      } catch (err) {
        console.error(err);
        statusEl.innerText = "❌ Offline";
      }

      // Realtime listener
      supabaseClient
        .channel('public:user_data')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'user_data' }, payload => {
          if (payload.new && payload.new.id === 'mochi_tasks') {
            tasks = payload.new.data;
            renderTasks();
          }
        })
        .subscribe();
    }

    async function saveData() {
      const statusEl = document.getElementById('status');
      statusEl.innerText = "⏳ Saving...";
      
      const { error } = await supabaseClient
        .from('user_data')
        .upsert({ id: 'mochi_tasks', data: tasks });

      if (error) {
        console.error("Error saving:", error);
        statusEl.innerText = "❌ Save Failed";
        statusEl.classList.remove('connected');
      } else {
        statusEl.innerText = "☁️ Cloud Connected";
        statusEl.classList.add('connected');
      }
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        if (task.completed) li.classList.add('completed');

        li.innerHTML = `
          <div style="display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
            <span>${escapeHtml(task.text)}</span>
          </div>
          <button class="delete-btn" onclick="deleteTask(${index})">✕</button>
        `;
        list.appendChild(li);
      });
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (!text) return;

      tasks.push({ text, completed: false });
      input.value = '';
      renderTasks();
      saveData();
    }

    function toggleTask(index) {
      tasks[index].completed = !tasks[index].completed;
      renderTasks();
      saveData();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      renderTasks();
      saveData();
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') addTask();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Run on startup
    init();
  </script>
</body>
</html>
